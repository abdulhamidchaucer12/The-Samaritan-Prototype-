<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        // 1. Silent Vite HMR WebSocket stub:
        // In iframe & preview environments where HMR is disabled, prevent WebSocket
        // connection failures from emitting [vite] console errors or breaking test harnesses.
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          function FakeViteSocket(url, protocols) {
            var isViteReq = false;
            if (protocols === 'vite-hmr') isViteReq = true;
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1)) isViteReq = true;

            if (isViteReq) {
              this.url = url;
              this.readyState = 1; // WebSocket.OPEN
              this.bufferedAmount = 0;
              this.extensions = '';
              this.protocol = 'vite-hmr';
              this.binaryType = 'blob';
              this.onopen = null;
              this.onmessage = null;
              this.onerror = null;
              this.onclose = null;
              this.listeners = {};
              var self = this;
              setTimeout(function() {
                if (typeof self.onopen === 'function') {
                  try { self.onopen({ type: 'open', target: self }); } catch(e) {}
                }
              }, 0);
            } else {
              return new RealWebSocket(url, protocols);
            }
          }

          FakeViteSocket.prototype.addEventListener = function(type, cb) {
            if (!this.listeners[type]) this.listeners[type] = [];
            this.listeners[type].push(cb);
            if (type === 'open') {
              var self = this;
              setTimeout(function() {
                try { cb({ type: 'open', target: self }); } catch(e) {}
              }, 0);
            }
          };

          FakeViteSocket.prototype.removeEventListener = function(type, cb) {
            if (!this.listeners[type]) return;
            this.listeners[type] = this.listeners[type].filter(function(fn) { return fn !== cb; });
          };

          FakeViteSocket.prototype.dispatchEvent = function() { return true; };
          FakeViteSocket.prototype.send = function() {};
          FakeViteSocket.prototype.close = function() {
            this.readyState = 3;
          };

          FakeViteSocket.CONNECTING = 0;
          FakeViteSocket.OPEN = 1;
          FakeViteSocket.CLOSING = 2;
          FakeViteSocket.CLOSED = 3;
          FakeViteSocket.prototype.CONNECTING = 0;
          FakeViteSocket.prototype.OPEN = 1;
          FakeViteSocket.prototype.CLOSING = 2;
          FakeViteSocket.prototype.CLOSED = 3;

          window.WebSocket = FakeViteSocket;
        }

        // 2. Prevent benign Vite development logs or socket notifications from triggering UI error overlays
        var isViteNoise = function(val) {
          if (!val) return false;
          var str = '';
          if (typeof val === 'string') {
            str = val;
          } else if (val && typeof val === 'object') {
            str = (val.message || '') + ' ' + (val.reason || '') + ' ' + (val.stack || '');
            if (!str.trim() && val.toString) str = val.toString();
          }
          if (typeof str !== 'string') return false;
          var lower = str.toLowerCase();
          return (
            str.indexOf('[vite]') !== -1 ||
            lower.indexOf('vite') !== -1 ||
            lower.indexOf('failed to connect to websocket') !== -1 ||
            lower.indexOf('websocket closed without opened') !== -1 ||
            lower.indexOf('vite:ws') !== -1
          );
        };

        var wrapConsole = function(origFn) {
          return function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isViteNoise(arguments[i])) return;
            }
            return origFn.apply(console, arguments);
          };
        };

        if (window.console) {
          console.error = wrapConsole(console.error);
          console.warn = wrapConsole(console.warn);
          console.log = wrapConsole(console.log);
          console.info = wrapConsole(console.info);
          console.debug = wrapConsole(console.debug);
        }

        window.addEventListener('error', function(event) {
          if (isViteNoise(event && event.message) || isViteNoise(event && event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteNoise(event && event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // 3. Theme restoration
        try {
          var t = localStorage.getItem('the_samaritan_theme_v2');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Samaritan</title>
    <meta name="description" content="Digital Civic Education and Government Literacy Platform by Kwale Focus Empowerment CBO (KFE). Know Your Government. Understand Your Rights. Shape Your Future." />

    <meta property="og:description" content="Digital Civic Education and Government Literacy Platform by Kwale Focus Empowerment CBO (KFE). Know Your Government. Understand Your Rights. Shape Your Future." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="The Samaritan" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>

  </body>
</html>
